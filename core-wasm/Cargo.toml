[package]
name = "refl-core-wasm"
version = "0.0.0"
description = "Browser bridge for refl-core: typed JSON entry points over wasm-bindgen."
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
refl-core = { path = "../core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2.130"

[lints]
workspace = true
