  <text x="200" y="526" text-anchor="middle" fill="#f4f1e8" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700">THE NORTH WIND</text>
  <text x="200" y="560" text-anchor="middle" fill="#f4f1e8" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700">AND THE SUN</text>
  <text x="200" y="586" text-anchor="middle" fill="#bcd6e5" font-family="Arial, sans-serif" font-size="14" letter-spacing="3">AESOP · A2</text>
