<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-labelledby="title desc">
  <title id="title">The North Wind and the Sun</title>
  <desc id="desc">A blue cover with swirling wind lines and a warm sun.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#315f86"/>
      <stop offset="1" stop-color="#102a40"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd98b"/>
      <stop offset="1" stop-color="#e58d43"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#sky)"/>
  <circle cx="286" cy="182" r="74" fill="url(#sun)"/>
  <g fill="none" stroke="#cfe3ef" stroke-linecap="round">
    <path d="M52 190 C120 140 188 238 256 186 C316 140 352 172 364 198" stroke-width="10" opacity=".85"/>
    <path d="M34 246 C108 196 166 288 240 236 C302 192 340 220 366 258" stroke-width="6" opacity=".55"/>
    <path d="M68 308 C136 266 190 344 256 300 C312 262 350 282 372 316" stroke-width="3" opacity=".38"/>
