[workspace]
resolver = "3"
members = ["core", "core-wasm", "server", "tools/content-build", "tools/sim"]

[workspace.package]
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

# The browser bridge is the only artifact with a hard size budget. Keep the
# normal release profile unchanged for native/benchmark builds; `just wasm`
# uses this profile only for the browser artifacts. `strip = "debuginfo"`
# keeps the target_features section that wasm-bindgen needs; wasm-opt strips
# the remaining debug/producer sections.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
