[package]
name = "book-build"
version = "0.0.0"
description = "Compiles content/books/ (Nickel + text) into deterministic graded-reader assets."
edition.workspace = true
publish.workspace = true

[dependencies]
content-build = { path = "../content-build" }
refl-core = { path = "../../core", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lints]
workspace = true
