[package]
name = "content-build"
version = "0.0.0"
description = "Compiles content/ (Nickel) into a checked, deterministic JSON bundle."
edition.workspace = true
publish.workspace = true

[dependencies]
refl-core = { path = "../../core", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sha2 = "0.10"

[lints]
workspace = true
