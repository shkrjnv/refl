[package]
name = "refl-sim"
version = "0.0.0"
description = "Synthetic learners and logs: fold and planner tests, the native = WASM hashes of the fold and of a session plan, timings, and the K5 cohort simulator against the «только FSRS» baseline."
edition.workspace = true
publish.workspace = true

[dependencies]
# Default features: the same no_std core the browser runs, also when this
# crate is built for wasm32-wasip1.
refl-core = { path = "../../core" }
# The generated log must be bit-identical on native and wasm32 too.
libm = "0.2"
uuid = { version = "1", default-features = false }
# Reading a bundle (cohort) and hashing a plan (plan-hash).
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
proptest = "1"
# Builds the real content for the Articles cohort test; needs `nickel`.
content-build = { path = "../content-build" }
# W24: the JSON boundary of the browser bridge, measured on the host.
refl-core-wasm = { path = "../../core-wasm" }

[lints]
workspace = true
