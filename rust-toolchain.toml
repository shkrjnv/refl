# Single source of the Rust version: read by fenix in flake.nix and by rustup/IDEs.
[toolchain]
channel = "1.100.0"
profile = "minimal"
components = ["clippy", "rustfmt", "rust-src", "rust-analyzer"]
# wasm32-wasip1: the native = WASM hash check runs the fold under wasmtime.
targets = ["wasm32-unknown-unknown", "wasm32-wasip1"]
