[package]
name = "refl-server"
version = "0.0.0"
description = "refl server: database migrations, event log, content import and HTTP API."
edition.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8"
form_urlencoded = "1"
refl-core = { path = "../core", features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = "1"
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "uuid", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
content-build = { path = "../tools/content-build" }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
