[package]
name = "eng-core"
version = "0.0.0"
description = "Pure learning core: domain types, event log, (later) answer checking, learner model, planner. No I/O."
edition.workspace = true
publish.workspace = true

[features]
# The default build is no_std + alloc: no filesystem, network, clock, threads or
# randomness are reachable, and std float functions (exp, ln, powf, ...) do not
# exist, so math must go through libm. `std` is only for tooling and tests.
default = []
std = ["serde/std", "serde_json/std", "uuid/std"]
# TypeScript bindings via ts-rs (tooling only; implies std).
ts = ["std", "dep:ts-rs"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc", "float_roundtrip"] }
uuid = { version = "1", default-features = false, features = ["serde"] }
libm = "0.2"
ts-rs = { version = "12", optional = true, default-features = false, features = ["serde-compat", "no-serde-warnings", "uuid-impl"] }

[dev-dependencies]
proptest = "1"


[lints]
workspace = true
